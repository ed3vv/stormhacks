<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Minigames in Spherical Geometry</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <canvas id="world"></canvas>
  <section id="menu">
    <h1>Minigames in Spherical Geometry</h1>
    <div id="menu-main" class="menu-buttons">
      <button id="play">Play</button>
    </div>
    <div id="menu-games" class="menu-buttons" hidden>
      <button id="play-golf">Mini golf</button>
      <button id="play-laser">Laser maze</button>
      <button id="play-nextbots">Nextbots</button>
    </div>
    <p id="menu-note" hidden>Coming soon!</p>
  </section>
  <section id="hud" hidden>
    <div id="fps">FPS: --</div>
    <div id="game">STROKES: 0</div>
    <div id="hint" hidden></div>
    <div id="help" class="help">Move cursor sideways to steer · up/down to set height · Space locks direction · Space again shoots · V free view · R resets</div>
  </section>
  <section id="laser-hud" hidden>
    <div id="crosshair" hidden></div>
    <div id="banner" hidden></div>
    <div id="laser-bottom">
      <div id="status" hidden></div>
      <div id="inventory" hidden></div>
    </div>
  </section>
  <div id="error" hidden></div>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
