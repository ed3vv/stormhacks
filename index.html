<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spherical Golf</title>
  <link rel="stylesheet" href="styles.css">
</head>
