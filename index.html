<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Minigames in Spherical Geometry</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <canvas id="world"></canvas>
  <section id="menu">
    <h1>Minigames in Spherical Geometry</h1>
    <div id="menu-main" class="menu-buttons">
      <button id="play">Play</button>
    </div>
    <div id="menu-games" class="menu-buttons" hidden>
      <button id="play-golf">Mini golf</button>
      <button id="play-laser">Laser maze</button>
      <button id="play-nextbots">Nextbots</button>
    </div>
    <p id="menu-note" hidden>Coming soon!</p>
  </section>
  <section id="hud" hidden>
    <div id="scoreline"></div>
    <div id="clubline"></div>
    <div id="fps"></div>
    <div id="crosshair">+</div>
    <div id="message"></div>
    <div id="aim" hidden></div>
    <div id="meter" hidden>
      <div id="meter-label"></div>
      <div id="meter-track"><div id="meter-fill"></div><div id="meter-pole" hidden></div></div>
    </div>
    <div id="hint"></div>
    <div id="controls">WASD walk · Shift run · Space jump · Mouse look · R stand at ball · B replay last spot · N restart · Esc free mouse</div>
  </section>
  <div id="error" hidden></div>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
